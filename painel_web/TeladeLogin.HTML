<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="TeladeLogin.CSS">
</head>
<body>

    <div class="card-login" id="card-login">

        <h1 class="titulo-login" id="titulo-login">Bem vindo!</h1>

        <p class="texto-login" id="texto-login">Faça login para acessar o sistema</p>

        <div class="campo-de-email" id="campo-de-email">
            <label class="titulo-email" for="texto-email">E-mail</label>
            <input type="email" id="texto-email" class="texto-email" placeholder="Digite seu e-mail">
        </div>

        <div class="campo-de-senha" id="campo-de-senha">
            <label class="titulo-senha" for="texto-senha">Senha</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" id="texto-senha" class="texto-senha" placeholder="Digite sua senha" style="width: 100%; box-sizing: border-box; padding-right: 40px;">
                <span id="alternar-senha" style="position: absolute; right: 12px; cursor: pointer; color: #718096; user-select: none; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </span>
            </div>
        </div> 
        
        <div class="campo-lembrar" id="campo-lembrar">
            <input type="checkbox" id="lembrar" class="checkbox-lembrar">
            <label for="lembrar" class="label-lembrar">Lembrar-me</label>
        </div>

        <button class="botao-login" id="botao-login">Entrar</button>
        
    </div> 
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="notificacoes.js"></script>
    
    <script>
        const btnLogin = document.getElementById('botao-login');
        const inputEmail = document.getElementById('texto-email');
        const inputSenha = document.getElementById('texto-senha');
        const alternarSenha = document.getElementById('alternar-senha');

        // Alternar visualização da senha
        alternarSenha.addEventListener('click', () => {
            const tipo = inputSenha.getAttribute('type') === 'password' ? 'text' : 'password';
            inputSenha.setAttribute('type', tipo);
            if (tipo === 'password') {
                alternarSenha.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            } else {
                alternarSenha.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            }
        });

        // Redireciona caso já esteja logado
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'telaprincipal.html';
            }
        });

        btnLogin.addEventListener('click', async () => {
            const email = inputEmail.value.trim();
            const senha = inputSenha.value;

            if (!email || !senha) {
                Alerta.aviso('Por favor, preencha todos os campos.');
                return;
            }

            try {
                await auth.signInWithEmailAndPassword(email, senha);
                window.location.href = 'telaprincipal.html';
            } catch (error) {
                console.error(error);
                let msg = 'Erro ao realizar login.';
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = 'E-mail ou senha incorretos.';
                } else if (error.code === 'auth/invalid-email') {
                    msg = 'Formato de e-mail inválido.';
                } else if (error.code === 'auth/operation-not-allowed') {
                    msg = 'O provedor de E-mail/Senha está desativado no console do Firebase. Ative-o em Authentication > Sign-in Method.';
                }
                Alerta.erro(msg + '<br><span style="font-size:12px; color:#94a3b8; margin-top:8px; display:inline-block;">' + error.message + '</span>', 'Falha no Login');
            }
        });
    </script>
</body>
</html>
