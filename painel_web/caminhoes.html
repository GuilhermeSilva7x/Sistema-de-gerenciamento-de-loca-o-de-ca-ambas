    <div id="modalCaminhao" class="modal-container">
        <div class="modal-conteudo">
            <div class="modal-cabecalho">
                <h3>Cadastrar Novo Veículo</h3>
                <span id="btnFecharModal" class="modal-fechar">&times;</span>
            </div>

            <form id="formCaminhao" class="modal-formulario">
                <label>Placa do Veículo</label>
                <input type="text" id="placa" required placeholder="Ex: ABC-1234">

                <label>Número do Chassi</label>
                <input type="text" id="chassi" required placeholder="Digite o chassi completo">

                <div class="modal-botoes">
                    <button type="button" id="btnCancelar" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar Caminhão</button>
                </div>
            </form>
        </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="notificacoes.js"></script>

    <script>
        let editCaminhaoId = null;

        // Controle de Sessão (Auth Guard com Validação de Regra de Acesso)
        let currentUser = null;

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'TeladeLogin.HTML';
            } else {
                try {
                    const checkDriver = await db.collection('motoristas').where('email', '==', user.email).get();
                    if (!checkDriver.empty) {
                        Alerta.erro("Motoristas não possuem permissão para acessar o painel administrativo.", "Acesso Negado");
                        await auth.signOut();
                        window.location.href = 'TeladeLogin.HTML';
                        return;
                    }
                } catch (err) {
                    console.error("Erro ao validar perfil:", err);
                }

                // Verifica o status do plano do admin
                try {
                    const empDoc = await db.collection('empresas').doc(user.uid).get();
                    if (!empDoc.exists) {
                        // Inicializa como pendente por padrão
                        await db.collection('empresas').doc(user.uid).set({
                            nome_empresa: 'Locadora de Caçambas',
                            email_admin: user.email,
                            plano_status: 'pendente',
                            plano_limite: 10,
                            data_cadastro: new Date().toISOString()
                        });
                        window.location.href = 'assinatura.html';
                        return;
                    } else {
                        const empData = empDoc.data();
                        if (empData.plano_status !== 'ativo') {
                            window.location.href = 'assinatura.html';
                            return;
                        }
                    }
                } catch (err) {
                    console.error("Erro ao validar plano:", err);
                }

                currentUser = user;
                await migrarDocumentosSemAdminId(user.uid);
                inicializarCaminhoes(user);

                const usuarioDiv = document.getElementById('usuario');
                if (usuarioDiv) usuarioDiv.textContent = 'Administrador';
            }
        });

        function inicializarCaminhoes(user) {

            // Mapeamento de elementos
            const modal = document.getElementById('modalCaminhao');
            const btnAbrir = document.getElementById('btnAbrirModal');
            const btnFecharX = document.getElementById('btnFecharModal');
            const btnCancelar = document.getElementById('btnCancelar');
            const formCaminhao = document.getElementById('formCaminhao');
            const corpoTabela = document.getElementById('corpoTabelaCaminhoes');

            // Abrir/Fechar Modal
            btnAbrir.addEventListener('click', () => {
                editCaminhaoId = null;
                modal.querySelector('h3').textContent = 'Cadastrar Novo Veículo';
                formCaminhao.reset();
                modal.classList.add('ativo');
            });
            btnFecharX.addEventListener('click', () => modal.classList.remove('ativo'));
            btnCancelar.addEventListener('click', (e) => {
                e.preventDefault();
                modal.classList.remove('ativo');
            });

            window.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('ativo');
            });

            // Salvar ou Editar Caminhão
            formCaminhao.addEventListener('submit', async (e) => {
                e.preventDefault();

                const placa = document.getElementById('placa').value.toUpperCase().trim();
                const chassi = document.getElementById('chassi').value.trim();

                if (!placa || !chassi) {
                    Alerta.aviso('Placa e Chassi são obrigatórios!');
                    return;
                }

                if (editCaminhaoId) {
                    // Modo Edição
                    try {
                        await db.collection('caminhoes').doc(editCaminhaoId).update({
                            placa,
                            chassi
                        });
                        Alerta.sucesso('Caminhão atualizado com sucesso!');
                        modal.classList.remove('ativo');
                        formCaminhao.reset();
                    } catch (error) {
                        Alerta.erro('Erro ao atualizar caminhão: ' + error.message);
                    }
                } else {
                    // Modo Cadastro
                    try {
                        await db.collection('caminhoes').add({
                            admin_id: user.uid,
                            placa,
                            chassi,
                            data_cadastro: new Date().toISOString()
                        });
                        Alerta.sucesso('Caminhão cadastrado com sucesso!');
                        modal.classList.remove('ativo');
                        formCaminhao.reset();
                    } catch (error) {
                        Alerta.erro('Erro ao salvar caminhão: ' + error.message);
                    }
                }
            });

            // Cruzamento de dados de motoristas vinculados
            let motoristas = [];
            let todosCaminhoes = [];
            let paginaAtual = 1;
            const itensPorPagina = 10;

            db.collection('motoristas').where('admin_id', '==', user.uid).onSnapshot((snapshot) => {
                motoristas = [];
                snapshot.forEach((docSnap) => {
                    motoristas.push(docSnap.data());
                });
                renderizarTabela();
            });

            db.collection('caminhoes').where('admin_id', '==', user.uid).onSnapshot((snapshot) => {
                todosCaminhoes = [];
                snapshot.forEach(doc => todosCaminhoes.push({ id: doc.id, data: doc.data() }));

                // Ordenar por placa de A-Z
                todosCaminhoes.sort((a, b) => (a.data.placa || '').localeCompare(b.data.placa || ''));

                renderizarTabela();
            });

            // Ouvinte do filtro de pesquisa
            document.getElementById('filtroPesquisaCaminhao').addEventListener('input', () => {
                paginaAtual = 1;
                renderizarTabela();
            });

            // Função para desenhar a tabela na tela
            function renderizarTabela() {
                corpoTabela.innerHTML = '';

                const queryText = document.getElementById('filtroPesquisaCaminhao').value.trim().toLowerCase();

                // Filtrar caminhoes
                const filtrados = todosCaminhoes.filter(item => {
                    const data = item.data;
                    const placa = (data.placa || '').toLowerCase();
                    const chassi = (data.chassi || '').toLowerCase();

                    const motoristaVinculado = motoristas.find(m => m.caminhao === data.placa);
                    const nomeMotorista = motoristaVinculado ? motoristaVinculado.nome.toLowerCase() : '';

                    return placa.includes(queryText) || chassi.includes(queryText) || nomeMotorista.includes(queryText);
                });

                // Paginação
                const totalPaginas = Math.ceil(filtrados.length / itensPorPagina);
                if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
                if (paginaAtual < 1) paginaAtual = 1;

                const inicio = (paginaAtual - 1) * itensPorPagina;
                const fim = inicio + itensPorPagina;
                const paginados = filtrados.slice(inicio, fim);

                if (paginados.length === 0) {
                    corpoTabela.innerHTML = '<tr><td colspan="4" style="text-align:center; color: #64748b;">Nenhum caminhão encontrado.</td></tr>';
                    renderizarPaginacao(0, 0);
                    return;
                }

                paginados.forEach(item => {
                    const cam = item.data;
                    const id = item.id;

                    const motoristaVinculado = motoristas.find(m => m.caminhao === cam.placa);
                    const nomeMotorista = motoristaVinculado ? motoristaVinculado.nome : '<span style="color: #94a3b8;">Nenhum</span>';

                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td><strong>${cam.placa}</strong></td>
                    <td>${cam.chassi || '-'}</td>
                    <td>${nomeMotorista}</td>
                    <td>
                        <button class="btn-editar" data-id="${id}" title="Editar" style="background:none; border:none; cursor:pointer; margin-right: 8px;">✏️</button>
                        <button class="btn-excluir" data-id="${id}" title="Excluir" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </td>
                `;

                    // Evento editar
                    tr.querySelector('.btn-editar').addEventListener('click', () => {
                        editCaminhaoId = id;
                        modal.querySelector('h3').textContent = 'Editar Veículo';
                        document.getElementById('placa').value = cam.placa || '';
                        document.getElementById('chassi').value = cam.chassi || '';
                        modal.classList.add('ativo');
                    });

                    // Evento excluir
                    tr.querySelector('.btn-excluir').addEventListener('click', async () => {
                        const camId = id;
                        const placaCaminhao = cam.placa || '';
                        const confirmou = await Alerta.confirmar({
                            titulo: 'Remover Caminhão',
                            texto: `Deseja realmente remover o veículo com placa ${placaCaminhao}?`,
                            confirmText: 'Sim, remover',
                            icone: 'warning',
                            perigo: true
                        });
                        if (confirmou) {
                            try {
                                await db.collection('caminhoes').doc(camId).delete();
                                Alerta.toast(`Veículo ${placaCaminhao} removido com sucesso!`);
                            } catch (err) {
                                Alerta.erro('Erro ao excluir: ' + err.message);
                            }
                        }
                    });

                    corpoTabela.appendChild(tr);
                });

                renderizarPaginacao(filtrados.length, totalPaginas);
            }

            function renderizarPaginacao(totalItens, totalPaginas) {
                let container = document.getElementById('paginacaoContainer');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'paginacaoContainer';
                    document.querySelector('.tabela').appendChild(container);
                }
                container.className = 'paginacao';
                container.style.cssText = 'display: flex; justify-content: center; gap: 8px; margin-top: 25px; margin-bottom: 25px; align-items: center;';
                container.innerHTML = '';

                if (totalPaginas <= 1) {
                    container.style.display = 'none';
                    return;
                }
                container.style.display = 'flex';

                // Botão Anterior
                const btnAnterior = document.createElement('button');
                btnAnterior.textContent = 'Anterior';
                if (paginaAtual === 1) {
                    btnAnterior.disabled = true;
                } else {
                    btnAnterior.addEventListener('click', () => {
                        paginaAtual--;
                        renderizarTabela();
                    });
                }
                container.appendChild(btnAnterior);

                // Páginas numéricas
                for (let i = 1; i <= totalPaginas; i++) {
                    const btnPagina = document.createElement('button');
                    btnPagina.textContent = i;
                    if (i === paginaAtual) {
                        btnPagina.className = 'pag-atual';
                    } else {
                        btnPagina.addEventListener('click', () => {
                            paginaAtual = i;
                            renderizarTabela();
                        });
                    }
                    container.appendChild(btnPagina);
                }

                // Botão Próximo
                const btnProximo = document.createElement('button');
                btnProximo.textContent = 'Próxima';
                if (paginaAtual === totalPaginas) {
                    btnProximo.disabled = true;
                } else {
                    btnProximo.addEventListener('click', () => {
                        paginaAtual++;
                        renderizarTabela();
                    });
                }
                container.appendChild(btnProximo);
            }
        }
    </script>
